<div id="ranking-track-page" class="page">
                    <div class="card">
                        <div class="card-body">
                            <div class="form-row" style="margin-bottom: 20px;">
                                <div class="form-group">
                                    <label for="ranking-track-date">选股日期</label>
                                    <input type="date" id="ranking-track-date" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label for="ranking-track-topn">Top N</label>
                                    <select id="ranking-track-topn" class="form-control">
                                        <option value="5">Top 5</option>
                                        <option value="10">Top 10</option>
                                        <option value="20">Top 20</option>
                                        <option value="50">Top 50</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label style="display: block; height: 1px; opacity: 0;">跟踪</label>
                                    <button class="btn btn-primary" id="track-ranking-btn">
                                        <span id="track-btn-text">排名跟踪</span>
                                        <span id="track-loading" class="loading-spinner" style="display:none;">⏳</span>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- 结果区域 -->
                            <div id="ranking-track-result">
                            </div>
                        </div>
                    </div>
                </div>
