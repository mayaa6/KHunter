<div id="khunter-page" class="page core-flow-page" data-core-step="khunter">
    <section class="core-flow-hero hunt-hero">
        <div class="core-flow-heading">
            <span class="eyebrow">HUNTING GROUND · 第三步</span>
            <h1>只在时机出现时出手</h1>
            <p>排名决定看谁，择时信号决定何时行动。这里是从研究走向交易计划的最后一关。</p>
        </div>
        <nav class="core-stepper" aria-label="核心决策路径">
            <button class="core-step is-complete" data-core-page="selection"><span>01</span><strong>选股</strong><small>发现候选</small></button>
            <i></i>
            <button class="core-step is-complete" data-core-page="stock-ranking"><span>02</span><strong>排名</strong><small>量化优先级</small></button>
            <i></i>
            <button class="core-step is-active" data-core-page="khunter"><span>03</span><strong>狩猎场</strong><small>确认时机</small></button>
        </nav>
    </section>

    <section class="hunt-control-panel">
        <div class="hunt-control-copy">
            <span class="section-kicker">执行参数</span>
            <h2>扫描买入窗口</h2>
            <p>保持日期与上一步一致，选择择时模型后开始扫描。</p>
        </div>
        <div class="hunt-controls">
            <label class="hunt-field"><span>狩猎日期</span><input type="date" id="hunting-date" class="form-control"></label>
            <label class="hunt-field"><span>跟踪天数</span><input type="number" id="tracking-days" class="form-control" min="1" max="365" value="10"></label>
            <label class="hunt-field"><span>择时策略</span><select id="timing-strategy" class="form-control"></select></label>
            <button id="calculate-btn" class="btn core-primary-action hunt-run"><span>开始扫描</span><span>↗</span></button>
        </div>
        <div class="hunt-secondary-actions">
            <div id="loading-indicator" class="loading-indicator" style="display:none;"><span class="spinner"></span><span>正在扫描买入窗口…</span></div>
            <button id="save-btn" class="text-action" style="display:none;">保存结果</button>
            <button id="generate-plan-btn" class="btn core-next-button" style="display:none;">生成交易计划 <span>→</span></button>
        </div>
    </section>

    <section class="core-workspace hunt-results">
        <div class="core-section-head">
            <div><span class="section-kicker">行动清单</span><h2>买点扫描结果</h2></div>
            <span id="result-summary" class="text-muted">尚未扫描</span>
        </div>
        <div class="hunt-stat-strip">
            <div><span id="total-count">—</span><small>符合买点</small></div>
            <div><span id="calculation-time">—</span><small>计算耗时</small></div>
            <div><span id="cache-status">—</span><small>数据状态</small></div>
        </div>
        <div class="table-container">
            <table id="results-table" class="data-table">
                <thead><tr><th>代码</th><th>名称</th><th>行业</th><th>板块</th><th>买入区间</th><th>形态策略</th><th>择时策略</th><th>择时信号</th><th>选入日期</th><th>评分</th></tr></thead>
                <tbody id="results-tbody"><tr><td colspan="10" class="placeholder">完成前两步后，点击“开始扫描”确认买入时机</td></tr></tbody>
            </table>
        </div>
    </section>
</div>
