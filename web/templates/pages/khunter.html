<div id="khunter-page" class="page">
                    <!-- 顶部控制区 -->
                    <div class="khunter-header card">
                        <div class="card-body">
                            <div class="khunter-controls" style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
                                <!-- 日期选择 -->
                                <div class="form-group" style="display: flex; flex-direction: row; align-items: center; gap: 10px; flex: 0 0 auto; min-width: 250px;">
                                    <label for="hunting-date" style="white-space: nowrap;">狩猎日期</label>
                                    <input type="date" id="hunting-date" class="form-control">
                                </div>
                                
                                <!-- 跟踪天数 -->
                                <div class="form-group" style="display: flex; flex-direction: row; align-items: center; gap: 10px; flex: 0 0 auto; min-width: 200px;">
                                    <label for="tracking-days" style="white-space: nowrap;">跟踪天数</label>
                                    <input type="number" id="tracking-days" class="form-control" min="1" max="365" value="10">
                                </div>
                                
                                <!-- 择时策略 -->
                                <div class="form-group" style="display: flex; flex-direction: row; align-items: center; gap: 10px; flex: 0 0 auto; min-width: 200px;">
                                    <label for="timing-strategy" style="white-space: nowrap;">择时策略</label>
                                    <select id="timing-strategy" class="form-control">
                                        <!-- 动态加载策略列表 -->
                                    </select>
                                </div>
                                
                                <!-- 操作按钮 -->
                                <div class="form-group" style="display: flex; flex-direction: row; gap: 10px; align-items: center; flex: 0 0 auto;">
                                    <button id="calculate-btn" class="btn btn-primary">
                                        <span class="icon">▶️</span> 计算
                                    </button>
                                    <button id="save-btn" class="btn btn-success" style="display: none;">
                                        <span class="icon">💾</span> 保存
                                    </button>
                                    <button id="generate-plan-btn" class="btn btn-info" style="display: none;">
                                        <span class="icon">📋</span> 生成交易计划
                                    </button>
                                    
                                    <!-- 加载指示器 -->
                                    <div id="loading-indicator" class="loading-indicator" style="display: none;">
                                        <span class="spinner"></span>
                                        <span>计算中...</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 结果表格 -->
                    <div class="khunter-content card">
                        <div class="card-header">
                            <h3>📊 分析结果</h3>
                            <span id="result-summary" class="text-muted"></span>
                        </div>
                        <div class="card-body">
                            <div class="table-container">
                                <table id="results-table" class="data-table">
                                    <thead>
                                        <tr>
                                            <th>股票代码</th>
                                            <th>股票名称</th>
                                            <th>行业</th>
                                            <th>板块</th>
                                            <th>买入区间</th>
                                            <th>策略名称</th>
                                            <th>择时策略</th>
                                            <th>择时信号</th>
                                            <th>选入日期</th>
                                            <th>评分</th>
                                        </tr>
                                    </thead>
                                    <tbody id="results-tbody">
                                        <tr><td colspan="10" class="placeholder">请选择日期并点击'计算'按钮开始分析</td></tr>
                                    </tbody>
                                </table>
                            </div>
                            

                        </div>
                    </div>
                    
                    <!-- 底部统计 -->
                    <div class="khunter-footer card">
                        <div class="card-body">
                            <div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                                <div class="stat-item">
                                    <span class="label">符合买点的股票总数：</span>
                                    <span id="total-count" class="value">-</span>
                                </div>
                                <div class="stat-item">
                                    <span class="label">计算耗时：</span>
                                    <span id="calculation-time" class="value">-</span>
                                </div>
                                <div class="stat-item">
                                    <span class="label">缓存状态：</span>
                                    <span id="cache-status" class="value">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
