<div id="stock-ranking-page" class="page">
                    <div class="card">
                        <div class="card-body">
                            <div class="form-row" style="margin-bottom: 20px;">
                                <div class="form-group" style="flex: 0 0 auto; width: 120px;">
                                    <label for="stock-ranking-date">选股日期</label>
                                    <input type="date" id="stock-ranking-date" class="form-control" style="width: 100%;">
                                </div>
                                <div class="form-group" style="flex: 0 0 auto;">
                                    <label style="display: block; height: 1px; opacity: 0;">生成</label>
                                    <button class="btn btn-primary" id="generate-ranking-btn">
                                        <span id="generate-btn-text">生成排名</span>
                                        <span id="generate-loading" class="loading-spinner" style="display:none;">⏳</span>
                                    </button>
                                </div>
                                <div class="form-group" style="flex: 0 0 auto;">
                                    <label style="display: block; height: 1px; opacity: 0;">重新生成</label>
                                    <button class="btn btn-danger" id="force-regenerate-ranking-btn" title="强制重新计算所有股票的评分">
                                        <span id="force-regenerate-btn-text">重新生成</span>
                                        <span id="force-regenerate-loading" class="loading-spinner" style="display:none;">⏳</span>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- 结果区域 -->
                            <div id="stock-ranking-result">
                            </div>
                        </div>
                    </div>
                </div>
