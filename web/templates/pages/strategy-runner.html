<div id="strategy-runner-page" class="page">
                    <div class="card">
                        <div class="card-body">
                            <!-- 执行条件 -->
                            <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:24px;" role="form" aria-label="执行条件">
                                <div>
                                    <label for="selection-strategy" style="font-size:12px; font-weight:600; color:#374151; display:block; margin-bottom:5px;">选股策略</label>
                                    <select class="form-control" id="selection-strategy" style="min-width:180px;">
                                        <option value="">加载中...</option>
                                    </select>
                                </div>
                                <div>
                                    <label for="timing-strategy" style="font-size:12px; font-weight:600; color:#374151; display:block; margin-bottom:5px;">择时策略</label>
                                    <select class="form-control" id="runner-timing-strategy" style="min-width:180px;">
                                        <!-- 动态加载策略列表 -->
                                    </select>
                                </div>
                                <button type="button" id="add-runner-task-btn" class="btn btn-primary" style="padding:6px 16px; font-size:12px;">加入任务</button>
                            </div>
                            
                            <!-- 任务列表区域 -->
                            <div id="runner-task-list" style="margin-bottom:24px; display:none;">
                                <h4 style="margin-bottom:12px; color:#374151;">已加入的执行任务</h4>
                                <div class="table-container" style="border:1px solid #e5e7eb; border-radius:6px; overflow:hidden; margin-bottom:12px;">
                                    <table class="data-table" id="runner-task-table" aria-label="执行任务列表" style="table-layout:fixed;">
                                        <thead>
                                        <tr>
                                            <th scope="col" style="width:50px;">序号</th>
                                            <th scope="col" style="width:200px;">选股策略</th>
                                            <th scope="col" style="width:120px;">择时策略</th>
                                            <th scope="col" style="width:60px; text-align:center;">操作</th>
                                        </tr>
                                        </thead>
                                        <tbody id="runner-task-body">
                                        </tbody>
                                    </table>
                                </div>
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                                        <div style="font-size:12px; color:#6b7280;">
                                            <span>任务总数: <span id="runner-task-count" style="font-weight:bold;">0</span></span>
                                        </div>
                                        <div style="display:flex; gap:10px;">
                                            <button type="button" id="init-runner-btn" class="btn btn-primary" style="padding:6px 16px; font-size:12px;">初始化策略运行器</button>
                                            <button type="button" id="start-runner-btn" class="btn btn-success" style="padding:6px 16px; font-size:12px;" disabled>开始执行</button>
                                        </div>
                                    </div>
                            </div>
                            
                            <!-- 执行进度区域 -->
                            <div id="runner-progress-container" style="display:none; margin-bottom:24px; padding:16px; border:1px solid #e5e7eb; border-radius:6px; background:#f9fafb;">
                                <div style="margin-bottom:12px;">
                                    <div id="runner-current-task" style="font-size:14px; font-weight:600; color:#374151; margin-bottom:8px;">正在执行: 加载中...</div>
                                    <div style="display:flex; gap:10px; align-items:center;">
                                        <div style="flex:1;">
                                            <div class="progress-bar" style="height:20px; background:#e5e7eb; border-radius:4px; overflow:hidden;">
                                                <div id="runner-progress-fill" style="height:100%; background:#22c55e; width:0%; transition:width 0.3s ease;"></div>
                                            </div>
                                        </div>
                                        <div id="runner-progress-percent" style="font-size:12px; font-weight:bold; color:#374151; min-width:40px;">0%</div>
                                    </div>
                                </div>
                                <div style="display:flex; gap:10px;">
                                    <button type="button" id="cancel-runner-btn" class="btn btn-danger" style="padding:6px 12px; font-size:12px;">取消</button>
                                </div>
                            </div>
                            
                            <!-- 执行状态 -->
                            <div id="runner-status-area" style="margin-bottom:24px;">
                                <span id="execution-status" class="execution-status status-idle">就绪</span>
                            </div>
                            
                            <!-- 今日状态 -->
                            <div id="strategy-status" class="card" style="margin-bottom:16px;">
                                <!-- 状态信息将通过JS动态加载 -->
                            </div>
                            
                            <!-- 统计卡片 -->
                            <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:16px;">
                                <div style="background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:16px; text-align:center;">
                                    <div style="font-size:12px; color:#6b7280; margin-bottom:4px;">持仓数量</div>
                                    <div style="font-size:20px; font-weight:bold; color:#374151;" id="position-count">0</div>
                                </div>
                                <div style="background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:16px; text-align:center;">
                                    <div style="font-size:12px; color:#6b7280; margin-bottom:4px;">可用资金</div>
                                    <div style="font-size:20px; font-weight:bold; color:#374151;" id="available-cash">¥0</div>
                                </div>
                                <div style="background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:16px; text-align:center;">
                                    <div style="font-size:12px; color:#6b7280; margin-bottom:4px;">总资产</div>
                                    <div style="font-size:20px; font-weight:bold; color:#374151;" id="total-assets">¥0</div>
                                </div>
                                <div style="background:#fff; border:1px solid #e5e7eb; border-radius:8px; padding:16px; text-align:center;">
                                    <div style="font-size:12px; color:#6b7280; margin-bottom:4px;">持仓盈亏</div>
                                    <div style="font-size:20px; font-weight:bold; color:#374151;" id="portfolio-profit">0%</div>
                                </div>
                            </div>
                            <div style="text-align:right; margin-bottom:12px; font-size:12px; color:#6b7280;" id="portfolio-date">资金日期: N/A</div>
                            
                            <!-- 股票池 -->
                            <div class="card" style="margin-bottom:16px;">
                                <div class="card-header" style="padding:10px 16px;">
                                    <span style="font-weight:600; color:#374151;" id="pool-title">股票池（用于择时）</span>
                                </div>
                                <div class="card-body" style="padding:0;">
                                    <div class="table-responsive">
                                        <table class="data-table">
                                            <thead>
                                                <tr>
                                                    <th>代码</th>
                                                    <th>名称</th>
                                                    <th>评分</th>
                                                    <th>状态</th>
                                                    <th>入池天数</th>
                                                    <th>现价</th>
                                                    <th>支撑位</th>
                                                </tr>
                                            </thead>
                                            <tbody id="pool-list">
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 持仓概览 -->
                            <div class="card" style="margin-bottom:16px;">
                                <div class="card-header" style="padding:10px 16px;">
                                    <span style="font-weight:600; color:#374151;">持仓概览</span>
                                </div>
                                <div class="card-body" style="padding:0;">
                                    <div class="table-responsive">
                                        <table class="data-table">
                                            <thead>
                                                <tr>
                                                    <th>代码</th>
                                                    <th>名称</th>
                                                    <th>持仓</th>
                                                    <th>成本</th>
                                                    <th>现价</th>
                                                    <th>盈亏额</th>
                                                    <th>盈亏%</th>
                                                    <th>持有天</th>
                                                    <th>操作</th>
                                                </tr>
                                            </thead>
                                            <tbody id="portfolio-list">
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 今日信号 -->
                            <div class="card" style="margin-bottom:16px;">
                                <div class="card-header" style="padding:10px 16px; display:flex; justify-content:space-between; align-items:center;">
                                    <span style="font-weight:600; color:#374151;" id="signals-title">今日信号</span>
                                </div>
                                <div class="card-body" style="padding:0;">
                                    <div class="table-responsive">
                                        <table class="data-table">
                                            <thead>
                                                <tr>
                                                    <th>类型</th>
                                                    <th>代码</th>
                                                    <th>名称</th>
                                                    <th>价格</th>
                                                    <th>数量</th>
                                                    <th>策略</th>
                                                    <th>原因</th>
                                                    <th>操作</th>
                                                </tr>
                                            </thead>
                                            <tbody id="signals-list">
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- 执行日志 -->
                            <div class="card" style="margin-bottom:16px;">
                                <div class="card-header" style="padding:10px 16px;">
                                    <span style="font-weight:600; color:#374151;">执行日志</span>
                                </div>
                                <div class="card-body" style="padding:12px;">
                                    <div id="execution-log" style="height:150px; overflow-y:auto; background:#f9fafb; border:1px solid #e5e7eb; border-radius:4px; padding:8px; font-size:12px; font-family:monospace;">
                                        <p style="color:#9ca3af; margin:0;">执行日志将显示在此处...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
