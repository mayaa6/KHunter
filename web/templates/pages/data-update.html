<div id="data-update-page" class="page">
                    <!-- 初始状态：显示上次更新时间和开始按钮 -->
                    <div id="update-initial-state" class="card">
                        <div class="card-body" style="text-align: center; padding: 60px 20px;">
                            <p style="font-size: 14px; color: #6b7280; margin: 0 0 10px 0;">上次更新时间</p>
                            <h2 id="last-update-time" style="font-size: 24px; font-weight: 600; color: #1f2937; margin: 0 0 30px 0;">-</h2>
                            <button class="btn btn-primary" id="update-start-btn" onclick="startDataUpdate()" style="font-size: 14px; padding: 10px 24px;">
                                ▶️ 开始更新
                            </button>
                        </div>
                    </div>

                    <!-- 重建近期除权股票 -->
                    <div id="exdividend-rebuild-card" class="card" style="margin-top: 20px;">
                        <div class="card-header" style="display: flex; align-items: center; justify-content: space-between;">
                            <h3>📌 重建近期除权股票历史数据</h3>
                        </div>
                        <div class="card-body" style="text-align: center; padding: 30px 20px;">
                            <p style="font-size: 14px; color: #6b7280; margin: 0 0 20px 0;">检测并重建指定时间范围内发生除权的股票历史数据</p>
                            
                            <!-- 时间范围选择 -->
                            <div style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px;">
                                <label style="font-size: 13px; font-weight: 500; color: #374151;">时间范围：</label>
                                <select class="form-control" id="exdividend-months">
                                    <option value="1">最近1个月</option>
                                    <option value="2" selected>最近2个月</option>
                                    <option value="3">最近3个月</option>
                                    <option value="6">最近6个月</option>
                                </select>
                            </div>
                            
                            <button class="btn btn-secondary" id="rebuild-exdividend-btn" onclick="startRebuildExdividend()" style="font-size: 14px; padding: 10px 24px;">
                                🔄 检测并重建除权股票
                            </button>
                            
                            <!-- 重建结果 -->
                            <div id="exdividend-result" style="display: none; margin-top: 20px; padding: 15px; background: #f9fafb; border-radius: 8px;">
                                <p id="exdividend-result-text" style="font-size: 14px; color: #1f2937; margin: 0;"></p>
                                <div id="exdividend-result-stats" style="display: flex; justify-content: center; gap: 30px; margin-top: 15px;">
                                    <div style="text-align: center;">
                                        <div style="font-size: 20px; font-weight: 600; color: #f59e0b;">
                                            <span id="exdividend-detected">0</span>
                                        </div>
                                        <div style="font-size: 11px; color: #6b7280;">检测到除权</div>
                                    </div>
                                    <div style="text-align: center;">
                                        <div style="font-size: 20px; font-weight: 600; color: #10b981;">
                                            <span id="exdividend-rebuilt">0</span>
                                        </div>
                                        <div style="font-size: 11px; color: #6b7280;">成功重建</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 更新进行中：显示进度 -->
                    <div id="update-progress-state" class="card" style="display: none;">
                        <div class="card-body" style="text-align: center; padding: 60px 20px;">
                            <div style="font-size: 48px; margin-bottom: 20px; animation: pulse 1.5s infinite;">⏳</div>
                            <p style="font-size: 16px; color: #6b7280; margin: 0 0 30px 0;">正在更新数据，请稍候...</p>
                            
                            <!-- 取消按钮 -->
                            <button class="btn btn-danger" onclick="cancelDataUpdate()">✕ 取消</button>
                        </div>
                    </div>

                    <!-- 更新完成：显示结果 -->
                    <div id="update-completed-state" class="card" style="display: none;">
                        <div class="card-body" style="text-align: center; padding: 40px 20px;">
                            <div id="update-result-icon" style="font-size: 48px; margin-bottom: 15px;">✅</div>
                            <p id="update-result-text" style="font-size: 16px; color: #10b981; margin: 0 0 30px 0; font-weight: 600;">数据更新成功！</p>
                            
                            <!-- 统计卡片 -->
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 15px; margin: 30px 0; max-width: 350px; margin-left: auto; margin-right: auto;">
                                <div style="padding: 12px; background: #f0fdf4; border-radius: 8px; text-align: center;">
                                    <div style="font-size: 11px; color: #6b7280; margin-bottom: 6px;">新增</div>
                                    <div id="update-result-added" style="font-size: 24px; font-weight: 600; color: #10b981;">0</div>
                                </div>
                                
                                <div style="padding: 12px; background: #fffbeb; border-radius: 8px; text-align: center;">
                                    <div style="font-size: 11px; color: #6b7280; margin-bottom: 6px;">更新</div>
                                    <div id="update-result-updated" style="font-size: 24px; font-weight: 600; color: #f59e0b;">0</div>
                                </div>
                                
                                <div style="padding: 12px; background: #f0f9ff; border-radius: 8px; text-align: center;">
                                    <div style="font-size: 11px; color: #6b7280; margin-bottom: 6px;">总计</div>
                                    <div id="update-result-total" style="font-size: 24px; font-weight: 600; color: #0284c7;">0</div>
                                </div>
                            </div>
                            
                            <!-- 重新开始按钮 -->
                            <button class="btn btn-primary" onclick="initDataUpdatePage()" style="margin-top: 20px;">
                                🔄 重新开始
                            </button>
                        </div>
                    </div>
                </div>
